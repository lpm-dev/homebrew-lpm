name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: Formula contract and style
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate Ruby syntax
        run: ruby -c Formula/lpm.rb
      - name: Test formula contract
        run: sh tests/formula-contract.sh
      - name: Check Homebrew style
        run: brew style Formula/lpm.rb
