name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: Formula contract and style (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate Ruby syntax
        run: ruby -c Formula/lpm.rb
      - name: Test formula contract
        run: sh tests/formula-contract.sh
      - name: Test dispatched release verification
        run: bash tests/verify-dispatched-release.sh
      - name: Check Homebrew style
        run: brew style Formula/lpm.rb

  install-without-xcode:
    name: Install on a Mac with only the Command Line Tools
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # Homebrew needs the Command Line Tools, and most of its users have no
      # Xcode. Their stapler fails on LPM's app with "internal error in Code
      # Signing subsystem".
      - name: Leave only the Command Line Tools
        run: |
          set -euo pipefail
          xcode=$(xcode-select -p | sed 's#/Contents/Developer$##')
          echo "SELECTED_XCODE=$xcode" >> "$GITHUB_ENV"
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          for app in /Applications/Xcode*.app; do
            sudo mv "$app" "${app%.app}.removed"
          done
          # xcrun remembers where it found tools.
          rm -f "${TMPDIR:-/tmp}"/xcrun_db* "$(getconf DARWIN_USER_TEMP_DIR)"/xcrun_db*
          test "$(env -u DEVELOPER_DIR xcode-select -p)" = /Library/Developer/CommandLineTools
      - name: Install the formula from this checkout
        env:
          HOMEBREW_NO_INSTALL_FROM_API: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          unset DEVELOPER_DIR
          brew tap-new --no-git local/lpm-ci
          cp Formula/lpm.rb "$(brew --repository local/lpm-ci)/Formula/lpm.rb"
          brew install --formula local/lpm-ci/lpm
          brew test local/lpm-ci/lpm
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/lpm.rb)
          test "$("$(brew --prefix)/bin/lpm" --version)" = "lpm $version"
      # Later steps of the runner, such as the checkout cleanup, run git.
      - name: Restore Xcode
        if: always()
        run: |
          for app in /Applications/Xcode*.removed; do
            [ -e "$app" ] && sudo mv "$app" "${app%.removed}.app"
          done
          sudo xcode-select --switch "${SELECTED_XCODE:-/Applications/Xcode.app}"
          rm -f "${TMPDIR:-/tmp}"/xcrun_db* "$(getconf DARWIN_USER_TEMP_DIR)"/xcrun_db*
