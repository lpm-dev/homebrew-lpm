name: Update Formula
run-name: Update lpm ${{ github.event.client_payload.version }} (${{ github.event.client_payload.correlation_id }})

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.0.6"

      # The dispatch only names a release. Its checksums are used only if
      # they are the ones that release signed.
      - name: Verify the dispatched release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA_DARWIN_ARM64: ${{ github.event.client_payload.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ github.event.client_payload.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ github.event.client_payload.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ github.event.client_payload.sha_linux_x64 }}
        run: bash scripts/verify-dispatched-release.sh

      - name: Update formula
        env:
          CORRELATION_ID: ${{ github.event.client_payload.correlation_id }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA_DARWIN_ARM64: ${{ github.event.client_payload.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ github.event.client_payload.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ github.event.client_payload.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ github.event.client_payload.sha_linux_x64 }}
        run: |
          if ! printf '%s\n' "$CORRELATION_ID" | grep -Eq '^rust-client-[1-9][0-9]*-[1-9][0-9]*$'; then
            echo "Invalid or missing release correlation ID" >&2
            exit 1
          fi
          ruby scripts/render-formula.rb

      - name: Test formula contract
        run: sh tests/formula-contract.sh

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lpm.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date — nothing to commit"
            exit 0
          fi
          git commit -m "Update lpm to $VERSION"
          git push
