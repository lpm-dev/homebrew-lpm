name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA_DARWIN_ARM64: ${{ github.event.client_payload.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ github.event.client_payload.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ github.event.client_payload.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ github.event.client_payload.sha_linux_x64 }}
        run: ruby scripts/render-formula.rb

      - name: Test formula contract
        run: sh tests/formula-contract.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lpm.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date — nothing to commit"
            exit 0
          fi
          git commit -m "Update lpm to ${{ github.event.client_payload.version }}"
          git push
